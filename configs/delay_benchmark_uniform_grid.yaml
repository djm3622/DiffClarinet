# Uniform-grid dataset check: k05 model and fit settings on targets off the coarse
# grid, 32 cases, seed 0, single-source and four-source fits.
output_dir: output/delay_benchmark_uniform_grid
datasets:
  comb: data/uniform_grid_pluck
  triangle: data/uniform_grid_triangle
methods:
- reinforce
- gumbel_sampled
- random_search_local
source_counts:
- 1
- 4
seeds:
- 0
instances: 32
selection_seed: 1729
threads: 1
model:
  L_min: 100
  L_max: 200
  position_min: 1
  position_max: 100
  initial_K: 0.9
  initial_a: 0.5
  initial_L: 150.5
  gain_min: 0.5
  gain_max: 1.0
fit:
  epochs: 20000
  refine_epochs: 20000
  n_fft: 8192
  reinforce_samples: 8
  continuous_lr: 0.01
  discrete_lr: 0.003
  spectrum_normalization: none
  initial_uniform_prior_weight: 0.05
  final_uniform_prior_weight: 0.001
  prior_anneal_epochs: 20000
  ordinal_smoothness_weight: 0.0001
  advantage_clip: 5.0
  gumbel_temperature: 1.0
  gumbel_temperature_end: 0.1
  exhaustive_cap: 20000
  print_frequency: 1000
  show_progress: false
workers: 1
sampled_gumbel:
  samples: 8
  physical_weighting: softmax
random_search:
  samples: 8
  local_radius: 3
  local_probability: 0.5
