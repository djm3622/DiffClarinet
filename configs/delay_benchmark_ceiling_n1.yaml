# Ceiling controls at n=1 on all 32 k05 cases, seed 0: exhaustive (L, position) search
# repeated at each grid K with a = 0.5, keeping the best (L, position, K) jointly, then the
# usual K/a refinement; and REINFORCE with K fixed to the true K (a, L, position learned).
# The grid starts at 0.55 because K = 0.5 is the open lower gain bound. Per-K search size
# is 10099 pairs (under the 20000 cap), 80792 evaluations per fit.
output_dir: output/delay_benchmark_ceiling_n1
datasets:
  comb: data/vary_all_pluck
  triangle: data/vary_all_triangle
methods:
- exhaustive_K_grid
- reinforce_oracle_K
source_counts:
- 1
seeds:
- 0
instances: 32
selection_seed: 1729
threads: 1
model:
  L_min: 100
  L_max: 200
  position_min: 1
  position_max: 100
  initial_K: 0.9
  initial_a: 0.5
  initial_L: 150.5
  gain_min: 0.5
  gain_max: 1.0
fit:
  epochs: 20000
  refine_epochs: 20000
  n_fft: 8192
  reinforce_samples: 8
  continuous_lr: 0.01
  discrete_lr: 0.003
  spectrum_normalization: none
  initial_uniform_prior_weight: 0.05
  final_uniform_prior_weight: 0.001
  prior_anneal_epochs: 20000
  ordinal_smoothness_weight: 0.0001
  advantage_clip: 5.0
  gumbel_temperature: 1.0
  gumbel_temperature_end: 0.1
  exhaustive_cap: 20000
  print_frequency: 500
  show_progress: false
workers: 1
exhaustive_K_grid: [0.55, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.98]
