# Noise-floor loss, noise robustness at 10 dB (triangle only): white Gaussian noise added to the observed mixture,
# SNR measured over the fitted first n_fft samples, one realization per case shared by
# methods and SNRs. k05 cases, n = 1, 3, 5, instances 0-4, seed 0; scored on clean labels.
# spectrum_normalization noise_floor adds the target-estimated noise power to each
# prediction before the log (model/kps/training.py noise_floor_power).
output_dir: output/delay_benchmark_noise_floor_snr10
datasets:
  triangle: data/vary_all_triangle
methods:
- reinforce
- gumbel_sampled
- random_search_local
source_counts:
- 1
- 3
- 5
seeds:
- 0
instances: 5
selection_seed: 1729
threads: 1
model:
  L_min: 100
  L_max: 200
  position_min: 1
  position_max: 100
  initial_K: 0.9
  initial_a: 0.5
  initial_L: 150.5
  gain_min: 0.5
  gain_max: 1.0
fit:
  epochs: 20000
  refine_epochs: 20000
  n_fft: 8192
  reinforce_samples: 8
  continuous_lr: 0.01
  discrete_lr: 0.003
  spectrum_normalization: noise_floor
  initial_uniform_prior_weight: 0.05
  final_uniform_prior_weight: 0.001
  prior_anneal_epochs: 20000
  ordinal_smoothness_weight: 0.0001
  advantage_clip: 5.0
  gumbel_temperature: 1.0
  gumbel_temperature_end: 0.1
  exhaustive_cap: 20000
  print_frequency: 500
  show_progress: false
workers: 1
sampled_gumbel:
  samples: 8
  physical_weighting: softmax
random_search:
  samples: 8
  local_radius: 3
  local_probability: 0.5
target_noise:
  snr_db: 10
